name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy analysis_agent
      - run: pytest
      - name: Generate sample reports
        run: java-migration-agent analyze sample-java8-app --output reports || test $? -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: migration-agent-${{ matrix.python-version }}
          path: |
            reports/
            README.md
            config/
